<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-labelledby="title">
  <title id="title">Java backend developer animation</title>
  <rect x="1" y="1" width="898" height="148" rx="18" fill="#0d1117" stroke="#30363d"/>
  <g font-family="monospace" font-size="24" font-weight="600">
    <text x="35" y="52" fill="#7ee787">&lt;backend&gt;</text>
    <text x="35" y="86" fill="#c9d1d9">Building reliable APIs</text>
    <text x="35" y="119" fill="#58a6ff">&lt;/backend&gt;</text>
  </g>
  <g transform="translate(620 30)">
    <rect x="0" y="0" width="225" height="90" rx="12" fill="#161b22" stroke="#30363d"/>
    <circle cx="18" cy="16" r="4" fill="#ff7b72"/><circle cx="32" cy="16" r="4" fill="#d29922"/><circle cx="46" cy="16" r="4" fill="#7ee787"/>
    <path d="M24 42 l-10 10 10 10 M42 42 l10 10 -10 10 M65 65 l15 -28" fill="none" stroke="#7ee787" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="opacity" values="1;.35;1" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <rect x="94" y="38" width="105" height="8" rx="4" fill="#30363d"/>
    <rect x="94" y="38" width="70" height="8" rx="4" fill="#58a6ff">
      <animate attributeName="width" values="35;85;50;70" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="94" y="57" width="85" height="6" rx="3" fill="#30363d"/>
    <rect x="94" y="57" width="55" height="6" rx="3" fill="#7ee787">
      <animate attributeName="width" values="55;30;75;55" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>